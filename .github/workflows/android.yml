name: Dựng app Android (APK thử)
on:
  workflow_dispatch:
  pull_request:
    paths: ["app/**", ".github/workflows/android.yml"]
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install --no-audit --no-fund
      - run: npm run www
      - run: npx cap add android
      - name: Nằm ngang, màn hình luôn sáng khi chơi
        run: |
          sed -i -E 's/<activity( |$)/<activity android:screenOrientation="sensorLandscape"\1/' android/app/src/main/AndroidManifest.xml
          grep -n screenOrientation android/app/src/main/AndroidManifest.xml
      - name: Icon từ prototype/icon
        run: |
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            for f in android/app/src/main/res/mipmap-$d/ic_launcher.png android/app/src/main/res/mipmap-$d/ic_launcher_round.png android/app/src/main/res/mipmap-$d/ic_launcher_foreground.png; do
              if [ -f "$f" ]; then cp ../prototype/icon/icon-512.png "$f"; fi
            done
          done
      - run: npx cap sync android
      - run: cd android && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: pho-cu-bac-mau-debug-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
